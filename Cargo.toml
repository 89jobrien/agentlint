[workspace]
members = [
    "crates/agentlint-core",
    "crates/agentlint-frontmatter",
    "crates/agentlint-docs",
    "crates/agentlint-plugins",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.6.0"
license = "MIT OR Apache-2.0"
authors = ["Joseph O'Brien"]
repository = "https://github.com/89jobrien/agentlint"
publish = true

[workspace.dependencies]
# Internal crates
agentlint-core        = { path = "crates/agentlint-core",        version = "0.6.0" }
agentlint-frontmatter = { path = "crates/agentlint-frontmatter", version = "0.6.0" }
agentlint-docs        = { path = "crates/agentlint-docs",        version = "0.6.0" }
agentlint-plugins     = { path = "crates/agentlint-plugins",     version = "0.6.0" }
# External shared deps
clap       = { version = "4",   features = ["derive"] }
nom        = "7"
proptest   = "1"
serde      = { version = "1",   features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile   = "3"
toml       = "0.8"
walkdir    = "2"

[package]
name = "agentlint"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "Linter for AI coding agent harness files (Claude Code, Cursor, Codex, Gemini, OpenCode, Pi)"

[[bin]]
name = "agentlint"
path = "src/main.rs"

[dependencies]
agentlint-core     = { workspace = true, features = ["config", "declarative"] }
agentlint-docs     = { workspace = true }
agentlint-plugins  = { workspace = true }
clap               = { workspace = true }
clap_complete      = "4"
clap_complete_nushell = "4"
serde_json         = { workspace = true }
walkdir            = { workspace = true }

[dev-dependencies]
agentlint-core     = { workspace = true, features = ["test-utils"] }
tempfile           = { workspace = true }
