# Declarative plugin: maestro feature-centric documentation structure validator
# Validates the docs/ tree follows the feature/use-case/research conventions
# defined in docs/guides/documentation-structure.md.

[plugin]
name = "maestro-docs"
prefix = "maestro-docs"

# --- Feature documentation (docs/features/[name]/*.md) ---

[[validator]]
id = "features"
patterns = ["docs/features/**/*.md"]
format = "markdown"
skip_filenames = ["README.md"]

[[validator.rules]]
id = "maestro-docs/features/empty"
check = "non-empty"
severity = "error"
difficulty = "easy"
message = "feature doc is empty"

[[validator.rules]]
id = "maestro-docs/features/no-heading"
check = "has-heading"
severity = "error"
difficulty = "easy"
message = "feature doc has no markdown heading"

[[validator.rules]]
id = "maestro-docs/features/too-short"
check = "min-content"
min_lines = 3
min_chars = 60
severity = "warning"
difficulty = "painful"
message = "feature doc has very little content"

[[validator.rules]]
id = "maestro-docs/features/too-long"
check = "max-lines"
max = 800
severity = "warning"
difficulty = "painful"
message = "feature doc exceeds 800 lines; consider splitting"

